name: GitHub Trophies

on:
  schedule:
    - cron: "0 6 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: obylo98/github-profile-trophy@master
        with:
          username: obylo98
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          theme: tokyonight
          output_path: trophy.svg

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git commit -m "chore: update trophies" || echo "No changes"
          git push
